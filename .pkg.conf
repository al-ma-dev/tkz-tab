# Reglages des scripts pkg-version / pkg-check / pkg-ctan (~/Documents/WKS/_scripts)
# (syntaxe bash ; liste des reglages en tete de _scripts/pkg-common.sh)
VER_RE='\d+\.\d+[a-z]?'                # 2.13, 2.12c
SAME_LINE=1                            # ne toucher que les lignes avec l'ancienne date
KEEP_RE='\(\d{4}/\d\d/\d\d\)'          # historique « v2.13 (2026/10/05) » intact
CHANGELOG=CHANGELOG.md
CL_HEAD='## [{VER}] — {DATE}'
CL_BODY='### Changed\n\n### Fixed\n'
DOC_PDF=doc/latex/build/TKZdoc-tab-main.pdf   # tache « Doc fr »
DOC_DEST=doc/TKZdoc-tab.pdf
DOC_EXTRA=("doc/latex-en/build/TKZdoc-tab-main.pdf:doc/TKZdoc-tab-en.pdf")   # tache « Doc en »
CTAN_EXCLUDES=(/_tests '*.orig' '*.synctex.gz')   # _tests/ : test-cles.tex
PRUNE_DIRS=(.git .nova _tests)
